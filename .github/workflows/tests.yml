name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install pandas numpy scipy networkx numba scikit-learn streamlit pydeck pytest
          pip install -e .
      - name: Run tests
        run: pytest -q
